<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla Private Owner Program | Steven Venditti</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root {
--tesla-red:#e31937;
--bg-dark:#050505;
--card-bg:#0f0f0f;
--border-color:rgba(255,255,255,0.1);
--text-main:#ffffff;
--text-dim:#888888;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background-color:var(--bg-dark);
color:var(--text-main);
overflow-x:hidden;
min-height:100vh;
}

.bg-grid{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.03) 1px, transparent 0);
background-size:40px 40px;
z-index:-1;
}

.container{
max-width:600px;
margin:0 auto;
padding:40px 20px;
display:flex;
flex-direction:column;
justify-content:center;
min-height:100vh;
}

.hidden{display:none!important;}

.tesla-card{
background:var(--card-bg);
border:1px solid var(--border-color);
border-radius:24px;
padding:40px;
box-shadow:0 30px 60px rgba(0,0,0,0.5);
position:relative;
overflow:hidden;
}

.logo-container{
text-align:center;
margin-bottom:40px;
}

.tesla-logo-img{
width:180px;
filter:brightness(0) invert(1);
animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
0%{transform:translateY(0)}
50%{transform:translateY(-6px)}
100%{transform:translateY(0)}
}

h1{
font-size:1.8rem;
font-weight:200;
letter-spacing:4px;
text-transform:uppercase;
margin-bottom:15px;
}

.red-accent{
color:var(--tesla-red);
font-weight:800;
letter-spacing:2px;
font-size:0.7rem;
text-transform:uppercase;
margin-bottom:5px;
display:block;
}

.btn-primary{
background:var(--tesla-red);
color:white;
border:none;
padding:18px 30px;
border-radius:12px;
font-weight:700;
width:100%;
cursor:pointer;
transition:0.3s;
text-transform:uppercase;
letter-spacing:2px;
margin-top:20px;
}

.btn-primary:hover{
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(227,25,55,0.3);
}

.btn-outline{
background:transparent;
color:var(--text-dim);
border:1px solid var(--border-color);
padding:15px;
border-radius:12px;
width:100%;
cursor:pointer;
margin-top:10px;
}

.form-group{margin-bottom:20px;}

label{
display:block;
font-size:0.7rem;
color:var(--text-dim);
text-transform:uppercase;
margin-bottom:8px;
}

input{
width:100%;
background:rgba(255,255,255,0.03);
border:1px solid var(--border-color);
padding:15px;
border-radius:10px;
color:white;
font-size:1rem;
transition:0.3s;
}

input:focus{
outline:none;
border-color:var(--tesla-red);
background:rgba(255,255,255,0.07);
}

.checkbox-wrapper{
display:flex;
gap:12px;
align-items:flex-start;
margin-top:25px;
}

.checkbox-wrapper input{
width:20px;
height:20px;
cursor:pointer;
accent-color:var(--tesla-red);
}

.status-bar{
height:4px;
background:#222;
border-radius:2px;
margin:20px 0;
overflow:hidden;
}

.status-progress{
height:100%;
background:var(--tesla-red);
width:65%;
transition:width 0.5s;
}

@media(max-width:600px){
h1{font-size:1.5rem;}
.tesla-logo-img{width:150px;}
}

</style>
</head>

<body>

<div class="bg-grid"></div>

<div class="container">

<div id="step-verify" class="tesla-card fade-in">

<div class="logo-container">

<img src="https://i.imgur.com/BvVUaDT.png" alt="Tesla Logo" class="tesla-logo-img">

</div>

<center>

<span class="red-accent">Exclusive Invitation</span>
<h1>Private Owner Program</h1>

<p style="color:var(--text-dim);margin-bottom:30px;line-height:1.6;">
<strong>Steven Venditti</strong>, you have been selected for enrollment into Tesla's most prestigious ownership tier. This invitation is non-transferable.
</p>

<button class="btn-primary" onclick="goToStep('step-offer')">View Invitation Details</button>

</center>
</div>

</div>

</body>
</html>
